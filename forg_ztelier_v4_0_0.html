<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>F_org — Organizational Friction Atelier</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Noto+Sans+JP:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
/* ============================================================
   Forg — Ztelier Edition
   Base: Ztelier Console UI v2.0 (Paper × Ink × Horizon)
         正典: design/ztelier-ui.md / ztelier-ui.tokens.json — SSOT
         paper = Future Blue / indigo = Cyber Black（変数名は旧来のまま維持）
   ※ 旧 Ztelier Common Kit v1.1.0 / v2.0 パッチ由来の値は
     UI Kit v1.0 に一本化（2026-08-08）
   Themes: paper (default·Future Blue) | indigo (dark·Cyber Black) | beige (light·Frontier Beige)
   v4.0.0: レイアウト一新 — 264px sticky サイドナビ + ヒーロー帯 + Horizon (Console UI v2.0 シェル)
   規約: フォントサイズ下限 11px（印刷含む・2026-08-08 ユーザー裁定）
   ============================================================ */
:root,
[data-theme="paper"]{
  /* surface */
  --bg:    #F7F9FB;
  --bg-1:  #FFFFFF;
  --bg-2:  #F1F4F8;
  --bg-3:  #E7ECF2;

  /* ink */
  --ink-0: #001744;
  --ink:   #0B1E3F;
  --ink-2: #3A4B6B;
  --ink-3: #6B7A95; /* Console UI v2.0 ink-muted（13px未満の文字はこれより薄くしない） */
  --ink-4: #8B96A8; /* Console UI v2.0 ink-faint */

  /* line */
  --line:   #E1E6EE;
  --line-2: #C9D1DE;
  --line-3: #A8B3C5;

  /* semantic */
  --primary:     #246CF7;
  --primary-2:   #1853CC;
  --primary-dim: rgba(36,108,247,.14); /* = Console UI v2.0 glow */
  --primary-tint:#E8EFFD;

  --trust:     #7BA05B;
  --trust-2:   #5F7D45;
  --trust-dim: #7BA05B18;

  --danger:     #C04A4A;
  --danger-2:   #A03A3A;
  --danger-dim: #C04A4A18;

  --warn:       #C88A2A;
  --warn-2:     #8A5F16;
  --warn-dim:   #C88A2A18;

  --info:       #246CF7;

  /* categorical — 分類色。最大5系統。増やさない
     Console UI v2.0 Pillar Colors に整列（pillar 1/3/4/5/6。緑=pillar2 は semantic trust と衝突するため不使用） */
  --cat-1: #1853CC;
  --cat-2: #5B4B9E;
  --cat-3: #B5832C;
  --cat-4: #A0517E;
  --cat-5: #3D8888;

  /* Forg 固有 — 4変数は categorical の別名。独自色は追加しない */
  --v-s:   var(--cat-2);  /* Silo       — 分子 / friction */
  --v-l:   var(--cat-3);  /* Legacy     — 分子 / friction */
  --v-c:   var(--cat-4);  /* Crisis     — 分母 / drive */
  --v-lp:  var(--cat-5);  /* Leadership — 分母 / drive */

  --topbar-bg: rgba(247, 249, 251, .88);
  --shadow-soft: 0 1px 2px rgba(11,30,63,.04), 0 4px 12px rgba(11,30,63,.04);   /* = shadow-card */
  --shadow-lift: 0 2px 4px rgba(11,30,63,.06), 0 12px 28px rgba(11,30,63,.08);
}

[data-theme="indigo"]{
  --bg:    #080D13;
  --bg-1:  #0F1720;
  --bg-2:  #111A23;
  --bg-3:  #1A2530;

  --ink-0: #FFFFFF;
  --ink:   #DFEAF0;
  --ink-2: #AEBFC9;
  --ink-3: #7F929E;
  --ink-4: #6A7D89;

  --line:   #1D2A35;
  --line-2: #2E414F;
  --line-3: #3F586A; /* 正典外・line-2 からの補間（正典は line 2段のみ） */

  --primary:     #3FD8CF;
  --primary-2:   #7FE9E2;
  --primary-dim: rgba(63,216,207,.2); /* = Console UI v2.0 glow */
  --primary-tint:#0F2E2C;

  --trust:     #9BC47A;
  --trust-2:   #7BA05B;
  --trust-dim: #9BC47A22;

  --danger:     #D86A6A;
  --danger-2:   #E38A8A;
  --danger-dim: #D86A6A22;

  --warn:       #E0A545;
  --warn-2:     #EFC079;
  --warn-dim:   #E0A54522;

  --info:       #3FD8CF;

  --cat-1: #5B8CFF;
  --cat-2: #9B87E8;
  --cat-3: #E0AC4E;
  --cat-4: #D97FB2;
  --cat-5: #5FBDBD;

  /* Forg 固有（theme ブロック内で再宣言：data-theme は body に付くため） */
  --v-s:   var(--cat-2);
  --v-l:   var(--cat-3);
  --v-c:   var(--cat-4);
  --v-lp:  var(--cat-5);

  --topbar-bg: rgba(8, 13, 19, .86);
  --shadow-soft: 0 1px 2px rgba(0,0,0,.45), 0 4px 14px rgba(0,0,0,.4);   /* = shadow-card */
  --shadow-lift: 0 2px 4px rgba(0,0,0,.5), 0 12px 32px rgba(0,0,0,.5);
}

/* Console UI v2.0 — Frontier Beige (light) */
[data-theme="beige"]{
  --bg:    #E6E3D9;
  --bg-1:  #F1EEE5;
  --bg-2:  #DCD8CB;
  --bg-3:  #CFCABB;

  --ink-0: #131C23;
  --ink:   #1E2A33;
  --ink-2: #43505B;
  --ink-3: #6A7681;
  --ink-4: #87929C;

  --line:   #CFCABB;
  --line-2: #B3AB98;
  --line-3: #978C75; /* 正典外・line-2 からの補間（正典は line 2段のみ） */

  --primary:     #8D784F;
  --primary-2:   #6A5834;
  --primary-dim: rgba(141,120,79,.2); /* = Console UI v2.0 glow */
  --primary-tint:#E5DCC7;

  --trust:     #7BA05B;
  --trust-2:   #5F7D45;
  --trust-dim: #7BA05B18;

  --danger:     #C04A4A;
  --danger-2:   #A03A3A;
  --danger-dim: #C04A4A18;

  --warn:       #C88A2A;
  --warn-2:     #8A5F16;
  --warn-dim:   #C88A2A18;

  --info:       #8D784F;

  /* Frontier Beige pillars {1,3,4,5,6}（paper/indigo と同じ色相保存マッピング） */
  --cat-1: #2F4D86;
  --cat-2: #5B4B7E;
  --cat-3: #8D6A2C;
  --cat-4: #8A4A5E;
  --cat-5: #3D7070;

  /* Forg 固有（theme ブロック内で再宣言：data-theme は body に付くため） */
  --v-s:   var(--cat-2);
  --v-l:   var(--cat-3);
  --v-c:   var(--cat-4);
  --v-lp:  var(--cat-5);

  --topbar-bg: rgba(230, 227, 217, .88);
  --shadow-soft: 0 1px 2px rgba(30,42,51,.06), 0 4px 12px rgba(30,42,51,.06);   /* = shadow-card */
  --shadow-lift: 0 2px 4px rgba(30,42,51,.08), 0 12px 28px rgba(30,42,51,.1);
}

:root{
  /* type — Console UI v2.0 stacks */
  --font-sans:    "Outfit", "Noto Sans JP", system-ui, sans-serif;
  --font-jp:      "Noto Sans JP", "Outfit", system-ui, sans-serif;
  --font-mono:    "JetBrains Mono", ui-monospace, monospace;
  --font-display: "Outfit", "Noto Sans JP", system-ui, sans-serif;

  /* spacing — 4px 基準の非線形スケール */
  --s-1: 4px;  --s-2: 6px;  --s-3: 8px;  --s-4: 12px;
  --s-5: 16px; --s-6: 20px; --s-7: 26px; --s-8: 32px;
  --s-9: 44px; --s-10: 56px;

  /* radius */
  --r-xs: 5px;  --r-sm: 7px;  --r-md: 9px;
  --r-lg: 12px; --r-xl: 14px; --r-pill: 999px;

  /* motion — Console UI v2.0: 180 / 280 / 520ms */
  --ease: cubic-bezier(.22,.61,.36,1);
  --t-fast: .18s; --t-mid: .28s; --t-slow: .52s;

  /* layout */
  --page-max: 1160px;   /* Console UI v2.0: 本文最大幅 */
  --page-pad: 64px;
  --topbar-h: 64px;
}

*,*::before,*::after{ box-sizing:border-box; }
html,body{
  margin:0; padding:0; background:var(--bg); color:var(--ink);
  font-family:var(--font-sans);
  -webkit-font-smoothing:antialiased;
  letter-spacing:0;
  text-rendering:optimizeLegibility;
  transition: background .3s, color .3s;
}
body{ min-height:100vh; }

a{ color:var(--primary); text-decoration:none; }
a:hover{ color:var(--primary-2); }
button{ font-family:inherit; }

.mono{ font-family:var(--font-mono); letter-spacing:.02em; }
.upper{ text-transform:uppercase; letter-spacing:.14em; }
.jp{ font-family:var(--font-jp); font-weight:300; }
.num{ font-variant-numeric: tabular-nums; letter-spacing:-0.01em; }
.nowrap{ white-space:nowrap; }

/* sub — F(org) 表記の下付き。UA既定の font-size:smaller は 11px を割るため、
   出現箇所ごとに明示サイズを与える（.brand-title / .nav-fbox .lbl / .footer /
   .lede-jp / .hero-title の 5 箇所。いずれも実効 11px 以上）。
   ここでは共通の垂直位置だけを揃える。 */
sub{ vertical-align:baseline; }

/* ==== App shell — 264px sticky サイドナビ + 本文 (Console UI v2.0) ==== */
.app{ position:relative; display:flex; min-height:100vh; width:100%; background:var(--bg); }
.main{ flex:1; min-width:0; display:flex; flex-direction:column; position:relative; z-index:1; }

/* ==== Side Nav ==== */
.sidenav{
  width:264px; flex-shrink:0;
  position:sticky; top:0; height:100vh;
  background:var(--bg-1);
  border-right:1px solid var(--line);
  display:flex; flex-direction:column;
  padding:20px 14px 14px;
  z-index:60;
  overflow-y:auto;
  transition: background .3s, border-color .3s;
}
.nav-top{ display:flex; align-items:center; gap:11px; padding:2px 8px 14px; }
.brand-mark{ width:28px; height:28px; flex-shrink:0; }
.brand-text{ display:flex; flex-direction:column; line-height:1.2; min-width:0; }
.brand-title{
  font-family:var(--font-display); font-size:15.5px; color:var(--ink);
  font-weight:600; letter-spacing:-0.02em; white-space:nowrap;
}
.brand-title em{ font-style:normal; color:var(--primary); font-weight:600; }
.brand-title sub{
  font-size:11px; font-weight:400; color:var(--ink-3); letter-spacing:0;
  vertical-align:baseline;
}
.brand-sub{
  font-family:var(--font-mono); font-size:11px; color:var(--ink-3);
  letter-spacing:.08em; text-transform:uppercase; white-space:nowrap;
}
.nav-burger{
  display:none;
  margin-left:auto; flex-shrink:0;
  width:34px; height:34px; border-radius:var(--r-sm);
  border:1px solid var(--line-2); background:var(--bg-1);
  color:var(--ink-2); cursor:pointer;
  align-items:center; justify-content:center;
}
.nav-body{ display:flex; flex-direction:column; flex:1; min-height:0; }
.nav-sec{
  font-family:var(--font-mono); font-size:11px; font-weight:500;
  letter-spacing:.16em; text-transform:uppercase; color:var(--ink-4);
  padding:14px 10px 7px;
}
.navrow{
  display:flex; align-items:center; gap:10px;
  width:100%; text-align:left;
  border:0; background:transparent; cursor:pointer;
  padding:8px 10px; margin-bottom:2px; border-radius:var(--r-sm);
  font-family:var(--font-sans); font-size:13.5px; font-weight:400;
  color:var(--ink-2); white-space:nowrap;
  transition: background var(--t-fast) var(--ease), color var(--t-fast) var(--ease);
}
.navrow:hover{ background:var(--bg-2); color:var(--ink); }
.navrow.on{ background:var(--primary-tint); color:var(--primary-2); font-weight:500; }
.navrow .n{
  font-family:var(--font-mono); font-size:11px; color:var(--ink-4);
  font-variant-numeric:tabular-nums; letter-spacing:.04em;
  width:18px; flex-shrink:0;
}
.navrow.on .n{ color:var(--primary-2); }
.navrow .prog{
  margin-left:auto; font-family:var(--font-mono); font-size:11px;
  color:var(--ink-4); letter-spacing:.04em; white-space:nowrap;
  font-variant-numeric:tabular-nums;
}
.navrow .done{
  margin-left:auto; width:6px; height:6px; border-radius:50%;
  background:var(--trust); flex-shrink:0;
}
.navrow .prog + .done{ margin-left:8px; }

/* status box — F 値と回答進捗の常時表示 */
.nav-fbox{
  margin:8px 10px 0; padding:13px 15px;
  border:1px solid var(--line); border-radius:var(--r-md);
  background:var(--bg);
}
.nav-fbox .lbl{
  font-family:var(--font-mono); font-size:11px; color:var(--ink-3);
  letter-spacing:.14em; text-transform:uppercase; font-weight:500;
}
.nav-fbox .lbl sub{ font-size:1em; letter-spacing:0; }
.nav-fbox .val{
  font-family:var(--font-display); font-size:26px; font-weight:500;
  letter-spacing:-0.02em; font-variant-numeric:tabular-nums;
  line-height:1.25; margin-top:2px;
}
.nav-fbox .st{
  font-family:var(--font-jp); font-weight:300; font-size:11.5px;
  color:var(--ink-3); margin-top:2px;
}
.nav-prog-track{
  height:4px; border-radius:2px; background:var(--bg-3);
  overflow:hidden; margin-top:12px;
}
.nav-prog-fill{
  height:100%; border-radius:2px; background:var(--primary);
  transition:width var(--t-slow) var(--ease);
}
.nav-prog-lbl{
  display:flex; justify-content:space-between;
  font-family:var(--font-mono); font-size:11px; color:var(--ink-4);
  margin-top:6px; letter-spacing:.04em; font-variant-numeric:tabular-nums;
}

/* utils — テーマ切替 / 印刷 / エクスポート / リセット（旧トップバーから移設） */
.nav-utils{
  margin-top:auto; padding:14px 10px 2px;
  border-top:1px solid var(--line);
  display:flex; align-items:center; gap:8px;
}
.util-btn{
  width:34px; height:34px; border-radius:var(--r-sm);
  border:1px solid var(--line-2); background:var(--bg-1);
  cursor:pointer; color:var(--ink-2);
  display:flex; align-items:center; justify-content:center;
  transition: all var(--t-fast) var(--ease);
  flex-shrink:0;
}
.util-btn:hover{ background:var(--bg-2); color:var(--ink); border-color:var(--line-3); }
.util-btn svg{ width:15px; height:15px; }
.nav-foot{
  padding:10px 10px 0;
  font-family:var(--font-mono); font-size:11px; color:var(--ink-4);
  letter-spacing:.08em;
}

/* .tag — UI Kit の .pill 仕様 */
.tag{
  display:inline-flex; align-items:center; gap:6px;
  font-family:var(--font-mono); font-size:11px; font-weight:500;
  letter-spacing:.12em; text-transform:uppercase; white-space:nowrap;
  color:var(--ink-2);
  border:1px solid var(--line-2); padding:5px 11px; border-radius:var(--r-pill);
  background: var(--bg-1);
  transition: all var(--t-fast) var(--ease);
}
.tag .dot{ width:6px; height:6px; border-radius:50%; background:var(--ink-3); }
.tag.live .dot{ background:var(--trust); }

.spacer{ flex:1; min-width:0; }

/* ==== Buttons ==== */
.btn{
  display:inline-flex; align-items:center; gap:8px;
  height:34px; padding:0 16px; border-radius:var(--r-md);
  border:1px solid var(--line-2);
  background: var(--bg-1); color:var(--ink); cursor:pointer;
  font-family:var(--font-sans); font-size:13px; font-weight:500;
  white-space:nowrap;
  transition: all var(--t-fast) var(--ease);
}
.btn:hover{
  background:var(--bg-2); border-color: var(--line-3);
}
.btn:focus-visible{ outline:2px solid var(--primary); outline-offset:2px; }
.btn:disabled{ opacity:.4; cursor:not-allowed; }
.btn.primary{
  background: var(--ink-0); color: var(--bg); border-color: var(--ink-0);
}
.btn.primary:hover{ background: var(--ink); }
.btn.accent{
  background: var(--primary); color:#fff; border-color:var(--primary);
}
.btn.accent:hover{ background: var(--primary-2); border-color:var(--primary-2); }
.btn.ghost{
  background: transparent; border-color: var(--line);
  color: var(--ink-3);
}
.btn.ghost:hover{ color:var(--ink); border-color: var(--line-2); background:transparent; }
.btn.trust{
  border-color: var(--trust); color: var(--trust);
}
.btn.trust:hover{
  background: var(--trust-dim); border-color: var(--trust-2); color: var(--trust-2);
}
.btn.sm{ height:28px; padding:0 12px; font-size:11.5px; border-radius:var(--r-sm); }

/* ==== Sections ==== */
.section{ padding: 44px var(--page-pad); }
.section.tight{ padding: 24px var(--page-pad); }
.container{ max-width: var(--page-max); margin: 0 auto; }
.section-divider{
  height:1px; background: var(--line);
  max-width: var(--page-max); margin: 0 auto;
}

/* ==== Hero band — surface-2→bg 縦グラデ + 下辺ヘアライン + 右44% accent グロー ==== */
.hero{
  position:relative;
  background:linear-gradient(180deg, var(--bg-2) 0%, var(--bg) 100%);
  border-bottom:1px solid var(--line);
  padding:56px var(--page-pad) 52px;
  overflow:hidden;
}
.hero::before{
  content:""; position:absolute; top:-30%; right:-6%;
  width:44%; padding-top:44%;
  border-radius:50%;
  background:radial-gradient(circle, var(--primary-dim) 0%, transparent 68%);
  pointer-events:none;
}
.hero > .container{ position:relative; }

/* chapter meta — mono チャプターメタ（36px の罫を挟む） */
.chapter-meta{
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  font-family:var(--font-mono); font-size:11px; font-weight:500;
  letter-spacing:.16em; text-transform:uppercase; color:var(--ink-3);
  margin-bottom:26px;
}
.chapter-meta .num{ color:var(--primary); }
.chapter-meta .rule{ width:36px; height:1px; background:var(--line-2); }
.chapter-meta .cjp{
  font-family:var(--font-jp); font-weight:400; font-size:11px;
  letter-spacing:.08em; text-transform:none;
}

/* ==== Typography ==== */
.hero-title{
  font-family:var(--font-display); font-weight:500;
  font-size:clamp(32px, 4.2vw, 50px);
  letter-spacing:-0.02em; color:var(--ink);
  line-height:1.14; margin:0 0 24px; max-width:24ch;
}
.hero-title em{ font-style:normal; color:var(--primary-2); font-weight:500; }
.hero-title sub{
  font-size:0.55em; font-weight:400; color:var(--ink-3);
  letter-spacing:0; vertical-align:baseline;
}

/* ==== Section head — mono 番号 + 28px + 右寄せ mono メタ + ヘアライン ==== */
.sec-head{
  display:flex; align-items:baseline; gap:16px; flex-wrap:wrap;
  border-bottom:1px solid var(--line);
  padding-bottom:14px; margin-bottom:30px;
}
.sec-head .num{
  font-family:var(--font-mono); font-size:11px; font-weight:500;
  color:var(--primary); letter-spacing:.16em; text-transform:uppercase;
  white-space:nowrap;
}
.sec-head h2{
  margin:0; font-family:var(--font-display);
  font-size:clamp(21px, 2.4vw, 28px);
  font-weight:500; letter-spacing:-0.015em; color:var(--ink); line-height:1.3;
}
.sec-head h2 em{ font-style:normal; color:var(--primary-2); font-weight:500; }
.sec-head .meta{
  margin-left:auto; font-family:var(--font-mono); font-size:11px;
  color:var(--ink-3); letter-spacing:.12em; text-transform:uppercase;
  white-space:nowrap;
}

/* kicker — 英語エディトリアル小見出し。mono ラベル文法 */
.kicker{
  font-family:var(--font-mono); font-size:11px;
  color:var(--primary); font-weight:500;
  letter-spacing:.16em; text-transform:uppercase;
  margin-bottom:22px; font-style:normal;
}
.lede-jp{
  font-family:var(--font-jp); font-weight:300;
  font-size:clamp(15px, 1.5vw, 17px);
  line-height:1.8; color:var(--ink-2);
  max-width:58ch; margin:0 0 40px;
  letter-spacing:.01em; text-wrap:pretty;
}
.lede-jp sub{ font-size:.7em; vertical-align:baseline; color:var(--ink-3); }
.lede-jp b{ color:var(--ink); font-weight:500; }

.metric-lg{
  font-family:var(--font-display); font-weight:400;
  font-size:clamp(26px, 2.4vw, 32px); line-height:1;
  letter-spacing:-0.02em; color:var(--ink);
  font-variant-numeric:tabular-nums;
}
/* aside figure — Result の主指標 54px（Console UI v2.0） */
.aside-fig{
  font-family:var(--font-display); font-weight:300;
  font-size:54px; line-height:1;
  letter-spacing:-0.03em;
  font-variant-numeric:tabular-nums;
}

/* mark-line — グラデーション不使用。フラットな下地帯で強調 */
.mark-line{
  box-shadow: inset 0 -.28em 0 var(--primary-dim);
  padding: 0 2px;
}

/* ==== Hero stat strip — 1px 罫で仕切った等分セル（箱にしない） ==== */
.stats-strip{
  display:grid; grid-auto-flow:column; grid-auto-columns:1fr;
  border-top:1px solid var(--line-2);
  margin-top:38px; max-width:880px;
}
.stats-strip > div{
  padding:18px 22px 0; border-left:1px solid var(--line-2); min-width:0;
}
.stats-strip > div:first-child{ padding-left:0; border-left:0; }
.stat-label{
  font-size:11px; color:var(--ink-3);
  letter-spacing:.12em; text-transform:uppercase;
  margin-bottom:9px; font-weight:500;
}
.stat-value{ display:flex; align-items:baseline; gap:7px; }
.stat-unit{ font-size:15px; color:var(--ink-3); }
.stat-caption{
  font-family:var(--font-jp); font-weight:300;
  font-size:12px; color:var(--ink-3); margin-top:7px;
}

/* ==== Card ==== */
.card{
  background: var(--bg-1);
  border:1px solid var(--line);
  border-radius:var(--r-xl);
  padding:22px 26px;
  box-shadow: var(--shadow-soft);
  transition: border-color var(--t-fast), box-shadow var(--t-fast),
              transform var(--t-fast) var(--ease), background .3s;
}
.card:hover{ border-color: var(--line-2); transform:translateY(-2px); box-shadow: var(--shadow-lift); }
.card.elevated{ box-shadow: var(--shadow-soft); }
.card.static:hover{ border-color: var(--line); transform:none; box-shadow: var(--shadow-soft); }

/* ==== Variable grid (Intro) ==== */
.var-grid{
  display:grid; grid-template-columns:repeat(4, minmax(0,1fr));
  gap:14px; margin-top:24px;
}
.var-card{
  padding:20px 22px;
  background: var(--bg-1);
  border:1px solid var(--line);
  border-radius:var(--r-lg);
  transition: border-color var(--t-fast);
}
.var-card:hover{ border-color: var(--line-2); }
.var-card .k{
  font-family:var(--font-display); font-size:26px; font-weight:500;
  color: var(--var-color); letter-spacing:-0.02em; line-height:1;
  display:flex; align-items:baseline; gap:8px;
}
.var-card .k em{
  font-style:normal; font-size:14px; color: var(--ink-3); font-weight:500;
  letter-spacing:.02em;
}
.var-card .kja{
  font-family:var(--font-jp); font-weight:500;
  font-size:12.5px; color:var(--ink);
  margin-top:10px; letter-spacing:-0.005em;
}
.var-card .kdesc{
  font-family:var(--font-jp); font-weight:300;
  font-size:11.5px; color: var(--ink-2); line-height:1.75;
  margin-top:6px;
}
.var-card .role-tag{
  font-family:var(--font-mono); font-size:11px;
  letter-spacing:.12em; text-transform:uppercase;
  color: var(--var-color); margin-top:12px;
  display:inline-block; font-weight:500; white-space:nowrap;
}

/* ==== F band card ==== */
.fband-card{
  padding:22px 26px;
  background: var(--bg-1); border:1px solid var(--line);
  border-radius:var(--r-xl);
}
.fband-head{
  display:flex; justify-content:space-between;
  font-family:var(--font-mono); font-size:11px;
  color:var(--ink-3); letter-spacing:.14em;
  text-transform:uppercase; margin-bottom:14px; font-weight:500;
}
.fband-row{
  display:flex; justify-content:space-between; align-items:center;
  padding:12px 0;
  border-top:1px solid var(--line);
}
.fband-row:first-of-type{ border-top:0; }
.fband-row .b{
  font-family:var(--font-mono); font-size:13px; font-weight:500;
  letter-spacing:.02em;
}
.fband-row .s{
  font-family:var(--font-jp); font-weight:500;
  font-size:14px;
}

/* ==== Customer strip ==== */
.cust-strip{
  display:flex; gap:14px; align-items:center; flex-wrap:wrap;
}
.cust-strip label{
  font-size:13px; color:var(--ink-2); font-weight:500; white-space:nowrap;
}

/* ==== ninput (text/number inputs) — UI Kit の .input / .input.num 仕様 ==== */
.ninput{
  background: var(--bg-1);
  border:1.5px solid var(--line-2);
  border-radius:10px;
  color: var(--ink);
  font-family:var(--font-mono); font-size:14px;
  padding:9px 14px;
  width:140px; text-align:right; outline:none;
  transition: border-color var(--t-fast), box-shadow var(--t-fast);
}
.ninput:focus{
  border-color: var(--primary);
  box-shadow: 0 0 0 3px var(--primary-dim);
}

/* ==== Question Card ==== */
.qcard{
  padding:22px 26px; margin-bottom:14px;
  background: var(--bg-1);
  border:1px solid var(--line);
  border-radius:var(--r-xl);
  box-shadow: var(--shadow-soft);
  transition: border-color var(--t-fast), background var(--t-fast),
              transform var(--t-fast) var(--ease), box-shadow var(--t-fast);
}
.qcard:hover{ border-color: var(--line-2); transform:translateY(-2px); box-shadow: var(--shadow-lift); }
/* 回答済み — 色付き縦バーは使わず、枠線と地色で示す（原則6） */
.qcard.answered{
  border-color: color-mix(in oklab, var(--trust) 40%, var(--line));
  background: color-mix(in oklab, var(--trust) 3%, var(--bg-1));
}
.qlabel{
  font-family:var(--font-mono); font-size:11px;
  letter-spacing:.14em; text-transform:uppercase;
  color:var(--ink-3); font-weight:500;
  margin-bottom:10px;
}
.qtext{
  font-family:var(--font-sans); font-size:16px; font-weight:500;
  line-height:1.5; color:var(--ink);
  margin-bottom:6px; letter-spacing:-0.005em;
}
.qhint{
  font-family:var(--font-jp); font-weight:300;
  font-size:12.5px; color:var(--ink-2);
  line-height:1.75; margin:10px 0 16px;
  padding-left:14px; border-left:1px solid var(--line-2);
  letter-spacing:.01em;
}

/* ==== Score buttons — UI Kit の .seg 仕様（44px / r-md / 1.5px line-2） ==== */
.score-row{ display:flex; gap:6px; }
.sbtn{
  flex:1; height:44px; min-width:44px;
  border:1.5px solid var(--line-2);
  background: transparent;
  color: var(--ink-3);
  font-family:var(--font-mono); font-size:15px; font-weight:500;
  letter-spacing:.06em;
  border-radius:var(--r-md); cursor:pointer;
  transition: all var(--t-fast) var(--ease);
}
.sbtn:hover{
  border-color: var(--ink-3); color:var(--ink); background: var(--bg-2);
}
.sbtn:focus-visible{ outline:2px solid var(--primary); outline-offset:2px; }
.sbtn[aria-pressed="true"]{ font-weight:500; } /* mono は 400/500 のみ読込（faux bold 回避） */
/* 分子（摩擦）: 低い=良い / 分母（推進力）: 高い=良い — .seg の v-* と同値 */
.sbtn.sel-lo{    border-color:var(--trust);  color:var(--trust);  background: var(--trust-dim); }
.sbtn.sel-mi{    border-color:var(--warn);   color:var(--warn);   background: var(--warn-dim); }
.sbtn.sel-hi{    border-color:var(--danger); color:var(--danger); background: var(--danger-dim); }
.sbtn.sel-dr-lo{ border-color:var(--danger); color:var(--danger); background: var(--danger-dim); }
.sbtn.sel-dr-mi{ border-color:var(--warn);   color:var(--warn);   background: var(--warn-dim); }
.sbtn.sel-dr-hi{ border-color:var(--trust);  color:var(--trust);  background: var(--trust-dim); }
/* .seg-ends 相当 */
.slabels{
  display:flex; justify-content:space-between;
  margin-top:9px; font-size:11px; color:var(--ink-3);
  font-weight:500;
}

/* ==== Role pill ==== */
/* role-pill — UI Kit の .pill 仕様 */
.role-pill{
  display:inline-flex; align-items:center; gap:6px;
  font-family:var(--font-mono); font-size:11px;
  letter-spacing:.12em; text-transform:uppercase; white-space:nowrap;
  padding:5px 11px; border-radius:var(--r-pill);
  background: var(--bg-1); border:1px solid var(--line-2);
  color: var(--ink-2); font-weight:500;
}
.role-pill.num{
  color: var(--danger);
  background: var(--danger-dim);
  border-color: color-mix(in oklab, var(--danger) 30%, var(--line));
}
.role-pill.den{
  color: var(--trust);
  background: var(--trust-dim);
  border-color: color-mix(in oklab, var(--trust) 30%, var(--line));
}

/* ==== Section summary row ==== */
.sec-sum{
  margin-bottom:20px; font-size:12.5px; color: var(--ink-3);
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
}

/* ==== Horizon band (Result) — 34px トラック / 56px 目盛 / 8s 光 / 2px ink マーカー ==== */
.horizon-wrap{ margin-top:18px; }
.horizon-band{
  position:relative; height:34px; border-radius:8px;
  background:var(--bg-2); border:1px solid var(--line);
  overflow:hidden;
}
.horizon-ruler{
  position:absolute; inset:0;
  background:repeating-linear-gradient(90deg, transparent 0 55px, var(--line) 55px 56px);
}
.horizon-fill{
  position:absolute; top:0; bottom:0; left:0;
  background:linear-gradient(90deg, var(--primary) 0%, var(--primary-2) 55%, var(--cat-2) 100%);
  opacity:.9;
  transition:width var(--t-slow) var(--ease);
}
.horizon-sweep{
  position:absolute; top:0; bottom:0; width:140px;
  background:linear-gradient(90deg, transparent, rgba(255,255,255,.16), transparent);
  animation:hsweep 8s linear infinite;
}
@keyframes hsweep{ from{ left:-140px; } to{ left:100%; } }
.horizon-marker{
  position:absolute; top:0; bottom:0; width:2px;
  background:var(--ink-0); opacity:.85;
}
.horizon-scale{
  display:flex; justify-content:space-between;
  font-family:var(--font-mono); font-size:11px; color:var(--ink-4);
  letter-spacing:.04em; margin-top:7px; font-variant-numeric:tabular-nums;
}

/* ==== Matrix (archetype 2x2) ==== */
.matrix{
  display:grid; grid-template-columns:1fr 1fr;
  gap:8px; margin:12px 0;
}
.mcell{
  padding:20px 16px; border-radius:var(--r-md); text-align:center;
  border:1.5px solid var(--line);
  background: var(--bg-2);
  opacity:.42;
  transition: opacity var(--t-mid) var(--ease), border-color var(--t-mid) var(--ease), background var(--t-mid) var(--ease);
}
/* 該当セルは罫線と地色で示す。影・浮き上がりは使わない（原則1） */
.mcell.active{
  opacity:1;
  border-color: var(--primary);
  background: color-mix(in oklab, var(--primary) 8%, var(--bg-1));
}
.mcell-icon{
  width:32px; height:32px; margin:0 auto 10px;
  display:flex; align-items:center; justify-content:center;
}
.mcell-icon svg{ width:100%; height:100%; }
.mcell-name{
  font-size:13px; font-weight:500; line-height:1.4;
  color: var(--ink); letter-spacing:-0.005em;
}
.mcell-name em{
  font-style:normal; font-weight:500;
  color: var(--ink-3); font-size:11px;
  display:block; margin-top:3px; letter-spacing:.02em;
}

/* ==== Contradictions — UI Kit の .callout 仕様 ==== */
.contra{
  padding:16px 20px; margin-bottom:12px;
  background: color-mix(in oklab, var(--warn) 4%, var(--bg-1));
  border:1px solid color-mix(in oklab, var(--warn) 30%, var(--line));
  border-radius:var(--r-lg);
}
.contra-title{
  font-size:13px; font-weight:500; color: var(--warn);
  margin-bottom:6px;
  display:flex; align-items:center; gap:8px;
  letter-spacing:-0.005em;
}
.contra-desc{
  font-family:var(--font-jp); font-weight:300;
  font-size:12.5px; color: var(--ink-2); line-height:1.75;
}

/* ==== Recommendations ==== */
.rec{
  display:flex; gap:14px; padding:16px 0;
  border-bottom:1px solid var(--line);
}
.rec:last-child{ border-bottom:none; }
/* rec-pri — UI Kit の .badge 仕様 */
.rec-pri{
  display:inline-flex; align-items:center;
  font-family:var(--font-mono); font-size:11px;
  padding:3px 8px; border-radius:var(--r-xs);
  height:fit-content; white-space:nowrap;
  font-weight:500; flex-shrink:0; margin-top:2px;
  letter-spacing:.10em; text-transform:uppercase;
}
.pri-1{
  background: var(--danger-dim); color: var(--danger);
  border:1px solid color-mix(in oklab, var(--danger) 30%, var(--line));
}
.pri-2{
  background: var(--warn-dim); color: var(--warn);
  border:1px solid color-mix(in oklab, var(--warn) 28%, var(--line));
}
.pri-3{
  background: var(--trust-dim); color: var(--trust);
  border:1px solid color-mix(in oklab, var(--trust) 28%, var(--line));
}
.rec-title{
  font-size:14.5px; font-weight:500;
  margin-bottom:5px; color: var(--ink);
  letter-spacing:-0.005em;
}
.rec-desc{
  font-family:var(--font-jp); font-weight:300;
  font-size:12.5px; color: var(--ink-2); line-height:1.75;
}

/* ==== Executive summary ==== */
/* exec-wrap — 色付き縦バー・影は使わず、1px 罫線で構造を作る（原則1/6） */
.exec-wrap{
  border:1px solid color-mix(in oklab, var(--exec-color) 30%, var(--line));
  background: var(--bg-1); border-radius:var(--r-xl);
  padding:24px 28px;
}
.exec-grid{
  display:grid; grid-template-columns:1fr 1.3fr;
  gap:24px; align-items:flex-start;
}
.exec-lbl{
  font-family:var(--font-mono); font-size:11px;
  letter-spacing:.14em; text-transform:uppercase;
  color: var(--ink-3); font-weight:500; margin-bottom:8px;
}
.exec-pname{
  font-family:var(--font-display); font-weight:500;
  font-size:clamp(22px, 2.6vw, 32px); line-height:1.15;
  color: var(--exec-color); margin-bottom:10px;
  letter-spacing:-0.02em;
}
.exec-diag{
  font-family:var(--font-jp); font-weight:300;
  font-size:13.5px; color: var(--ink-2); line-height:1.75;
}
.exec-dev{
  font-family:var(--font-mono); font-size:11px;
  color: var(--ink-3); margin-top:12px;
  letter-spacing:.04em;
}
.exec-action{
  background: color-mix(in oklab, var(--exec-color) 6%, var(--bg-1));
  border:1px solid color-mix(in oklab, var(--exec-color) 28%, var(--line));
  padding:18px 22px; border-radius:var(--r-lg);
}
.exec-act-txt{
  font-size:17px; font-weight:500; color: var(--ink);
  line-height:1.5; margin-bottom:10px;
  letter-spacing:-0.01em;
}
/* ref 行が無い状態（reference_framework: null）で下余白が残らないように */
.exec-action > .exec-act-txt:last-child{ margin-bottom:0; }
.exec-act-ref{
  font-family:var(--font-mono); font-size:11px;
  color: var(--ink-3); letter-spacing:.04em;
}
.exec-foot{
  margin-top:18px; padding-top:14px;
  border-top:1px dashed var(--line-2);
  font-family:var(--font-jp); font-weight:300;
  font-size:12.5px; color: var(--ink-3);
  text-align:center; letter-spacing:.01em;
}

/* ==== Pull quote ==== */
.pull-quote{
  font-family:var(--font-display); font-weight:400;
  font-size:clamp(22px, 2.6vw, 32px);
  line-height:1.35; letter-spacing:-0.02em;
  color: var(--ink); max-width:42ch;
}
.pull-quote em{
  font-style:normal; color: var(--primary); font-weight:500; /* 日本語太字禁止（正典）: 600→500 */
}

/* ==== Eyebrow / small label ==== */
.eyebrow{
  font-family:var(--font-mono); font-size:11px;
  letter-spacing:.16em; text-transform:uppercase;
  color: var(--ink-3); font-weight:500;
  display:inline-flex; align-items:center; gap:8px;
  margin-bottom:16px;
}
.eyebrow::before{
  content:""; width:18px; height:1px; background:var(--primary);
}

/* ==== Reveal on scroll ==== */
.reveal{
  opacity:0; transform: translateY(12px);
  transition: opacity var(--t-slow) var(--ease),
              transform var(--t-slow) var(--ease);
}
.reveal.in{ opacity:1; transform:none; }
.reveal.d1{ transition-delay:.08s; }
.reveal.d2{ transition-delay:.16s; }
.reveal.d3{ transition-delay:.24s; }
.reveal.d4{ transition-delay:.32s; }

@media (prefers-reduced-motion: reduce) {
  .reveal{ opacity:1; transform:none; transition:none; }
  *{ animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}

/* ==== Cursor aura — 520px accent グロー円が z-index 0 で追従 ==== */
.aura{
  position:fixed; left:0; top:0; width:520px; height:520px;
  border-radius:50%; pointer-events:none; z-index:0;
  background:radial-gradient(circle, var(--primary-dim) 0%, transparent 65%);
  transform:translate(-50%,-50%);
  opacity:0; transition:opacity .5s var(--ease);
  will-change:left, top;
}
@media (prefers-reduced-motion: reduce){ .aura{ display:none; } }

/* ==== Footer ==== */
.footer{
  border-top:1px solid var(--line);
  padding: 36px var(--page-pad);
  font-size:12.5px; color: var(--ink-3);
  line-height:1.9; text-align:center;
  font-family:var(--font-jp); font-weight:300;
}
.footer sub{ font-size:11px; }
.footer a{
  color: var(--ink-2); text-decoration:none;
  border-bottom:1px solid var(--line-2);
  transition: color var(--t-fast), border-color var(--t-fast);
}
.footer a:hover{ color: var(--primary); border-color: var(--primary); }
.foot-badge{
  display:inline-flex; align-items:center; gap:8px;
  padding:10px 18px; margin-top:14px;
  background: var(--bg-1); border:1px solid var(--line);
  border-radius:var(--r-pill);
  font-size:12px; color: var(--ink-2);
  font-family:var(--font-jp); font-weight:300;
}

/* ==== Scrollbar ==== */
::-webkit-scrollbar{ width:10px; height:10px; }
::-webkit-scrollbar-thumb{ background:var(--line-2); border-radius:6px; border:2px solid var(--bg); }
::-webkit-scrollbar-thumb:hover{ background:var(--line-3); }
::-webkit-scrollbar-track{ background:transparent; }

/* ==== Print ==== */
@media print{
  /* data-theme は body に付くため :root だけの上書きは効かない。
     印刷は常に paper パレットへ固定する（indigo のまま印刷すると
     暗色地・低コントラストの PDF になるため）。 */
  :root, body[data-theme]{
    --bg:    #FFFFFF;
    --bg-1:  #FFFFFF;
    --bg-2:  #F1F4F8;
    --bg-3:  #E7ECF2;
    --ink-0: #001744;
    --ink:   #0B1E3F;
    --ink-2: #3A4B6B;
    --ink-3: #6B7A95;
    --ink-4: #8B96A8;
    --line:   #E1E6EE;
    --line-2: #C9D1DE;
    --line-3: #A8B3C5;
    --primary:#246CF7; --primary-2:#1853CC; --primary-dim:rgba(36,108,247,.14); --primary-tint:#E8EFFD;
    --trust:  #7BA05B; --trust-2:  #5F7D45; --trust-dim:  #7BA05B18;
    --danger: #C04A4A; --danger-2: #A03A3A; --danger-dim: #C04A4A18;
    --warn:   #C88A2A; --warn-2:   #8A5F16; --warn-dim:   #C88A2A18;
    --info:   #246CF7;
    --cat-1:#1853CC; --cat-2:#5B4B9E; --cat-3:#B5832C; --cat-4:#A0517E; --cat-5:#3D8888;
  }

  /* A4 横。旧版は zoom:0.80 で縮尺を合わせていたが、11px ラベルが
     実効 8.8px となり下限規約（11px・印刷含む）に反するため撤去。
     横方向は .container の幅解放（下記）で吸収する。 */
  @page{ size: A4 landscape; margin: 10mm; }
  html{ width:auto !important; }
  body{
    -webkit-print-color-adjust:exact; print-color-adjust:exact;
    width:auto !important; margin:0 !important; padding:0 !important;
    overflow:visible !important;
  }

  /* 画面専用UIの除去 */
  .no-print, .sidenav, .aura, .btn{ display:none !important; }
  .app{ display:block !important; }
  .section-divider{ display:none !important; }

  /* コンテナを印刷領域いっぱいに開放（横切れの主因） */
  .container{ max-width:100% !important; width:100% !important; margin:0 !important; }
  .section{ padding: 10px 0 !important; }
  .hero{ padding:10px 0 !important; background:none !important; break-after:avoid; page-break-after:avoid; }
  .hero::before{ display:none !important; }

  /* IntersectionObserverで未発火の要素が白紙になるのを防ぐ */
  .reveal{ opacity:1 !important; transform:none !important; }

  /* ブロックがページ境界で割れるのを防ぐ（縦の見切れ対策） */
  .card, .var-card, .qcard, .exec-wrap, .contra, .sec-sum,
  .fband-card, .stats-strip > *, .matrix > *, .rec{
    break-inside: avoid !important;
    page-break-inside: avoid !important;
    box-shadow:none !important;
  }

/* ============================================================
   Counter with IntersectionObserver-triggered easing
   ============================================================ */
function Counter({value, className, decimals}){
  const isNum = /^-?[\d,.]+$/.test(String(value));
  const target = isNum ? parseFloat(String(value).replace(/,/g,'')) : 0;
  const ref = useRef(null);
  const prevTargetRef = useRef(null); // null = not yet animated

  const fmt = (v) => decimals!=null ? v.toFixed(decimals)
    : Number.isInteger(target) ? Math.round(v).toString()
    : v.toFixed(String(value).split('.')[1]?.length||1);

  const finalDisplay = !isNum ? String(value) : fmt(target);

  useEffect(()=>{
    const el = ref.current;
    if (!el || !isNum) return;
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const prev = prevTargetRef.current ?? 0;
    prevTargetRef.current = target;
    if (reduce || Math.abs(target - prev) < 0.001){
      el.textContent = fmt(target);
      return;
    }

    let cancelled = false, timerId = 0;
    const dur = 1100, t0 = Date.now();
    const tick = () => {
      if (cancelled) return;
      const k = Math.min(1, (Date.now()-t0)/dur);
      const ease = 1 - Math.pow(1-k, 3);
      const v = prev + (target-prev) * ease;
      el.textContent = fmt(v);
      if (k<1) timerId = setTimeout(tick, 30);
      else el.textContent = fmt(target);
    };
    el.textContent = fmt(prev);
    timerId = setTimeout(tick, 30);
    return ()=>{ cancelled = true; clearTimeout(timerId); };
  // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [target, isNum]);

  return <span ref={ref} className={className}>{finalDisplay}</span>;
}

/* ============================================================
   Question card + Scoring
   ============================================================ */
function QuestionCard({q, role, value, onScore, sc, onSc}){
  const answered = value > 0 || (q.type==='budget' && sc.itBudget>0 && sc.revenue>0);
  return (
    <div className={`qcard ${answered?'answered':''}`}>
      <div className="qlabel">{q.label}</div>
      <div className="qtext">{q.text}</div>
      {q.hint && <div className="qhint">{q.hint}</div>}
      {q.type==='budget'
        ? <BudgetInput sc={sc} onSc={onSc}/>
        : <ScoreButtons q={q} role={role} value={value} onScore={onScore}/>}
    </div>
  );
}

function ScoreButtons({q, role, value, onScore}){
  const isNum = role==='numerator';
  const rowRef = useRef(null);
  /* 操作性: 1–5 で直接採点 / ←→ で増減 / ↑↓ で前後の設問へフォーカス移動。
     採点は従来どおり onScore に委譲（ロジック不変） */
  const onKey = (e)=>{
    if (e.key>='1' && e.key<='5'){ e.preventDefault(); onScore(parseInt(e.key,10)); return; }
    if (e.key==='ArrowRight'){ e.preventDefault(); onScore(Math.min(5,(value||0)+1)); return; }
    if (e.key==='ArrowLeft'){ e.preventDefault(); onScore(Math.max(1,(value||2)-1)); return; }
    if (e.key==='ArrowDown' || e.key==='ArrowUp'){
      e.preventDefault();
      const rows = Array.from(document.querySelectorAll('.score-row'));
      const i = rows.indexOf(rowRef.current);
      const next = rows[i + (e.key==='ArrowDown'?1:-1)];
      if (next){
        const target = next.querySelector('[aria-pressed="true"]') || next.querySelector('.sbtn');
        if (target){ target.focus(); target.scrollIntoView({block:'center', behavior:'smooth'}); }
      }
    }
  };
  return (
    <div>
      <div className="score-row" ref={rowRef} onKeyDown={onKey}>
        {[1,2,3,4,5].map(v=>{
          const sel = value===v;
          let cls = '';
          if (sel){
            if (isNum){
              cls = v<=2 ? 'sel-lo' : v===3 ? 'sel-mi' : 'sel-hi';
            } else {
              cls = v<=2 ? 'sel-dr-lo' : v===3 ? 'sel-dr-mi' : 'sel-dr-hi';
            }
          }
          return <button key={v} className={`sbtn ${cls}`} onClick={()=>onScore(v)}
                         aria-pressed={sel} aria-label={`Score ${v}`}>{v}</button>;
        })}
      </div>
      <div className="slabels"><span>{q.lo}</span><span>{q.hi}</span></div>
    </div>
  );
}

function BudgetInput({sc, onSc}){
  const ratio = (sc.revenue>0 && sc.itBudget>0) ? (sc.itBudget/sc.revenue)*100 : null;
  const level = ratio==null ? null :
    ratio<1 ? '深刻な投資不足' :
    ratio<3 ? '日本平均以下' :
    ratio<5 ? '日本平均〜グローバル平均' :
    ratio<8 ? 'グローバル平均水準' : '先進的';
  const c = ratio==null ? 'var(--ink-3)' :
    ratio<1 ? 'var(--danger)' :
    ratio<3 ? 'var(--warn)' :
    ratio<5 ? 'var(--primary)' :
    ratio<8 ? 'var(--trust)' : 'var(--info)';
  return (
    <div style={{display:'flex', flexDirection:'column', gap:10}}>
      <div style={{display:'flex', alignItems:'center', gap:10, flexWrap:'wrap'}}>
        <span style={{fontSize:13, color:'var(--ink-2)', width:90, fontWeight:500}}>IT予算額:</span>
        <input className="ninput" type="number" value={sc.itBudget||''} onChange={e=>onSc('itBudget', parseFloat(e.target.value)||0)} placeholder="30" style={{width:120}}/>
        <span style={{fontSize:12, color:'var(--ink-3)'}}>億円</span>
      </div>
      <div style={{display:'flex', alignItems:'center', gap:10, flexWrap:'wrap'}}>
        <span style={{fontSize:13, color:'var(--ink-2)', width:90, fontWeight:500}}>年間売上高:</span>
        <input className="ninput" type="number" value={sc.revenue||''} onChange={e=>onSc('revenue', parseFloat(e.target.value)||0)} placeholder="5000" style={{width:120}}/>
        <span style={{fontSize:12, color:'var(--ink-3)'}}>億円</span>
      </div>
      {ratio!=null && (
        <div style={{
          fontSize:12, color:c, marginTop:4,
          padding:'10px 14px', background:'var(--bg-1)',
          borderRadius:10,
          border:`1px solid ${c==='var(--ink-3)'?'var(--line)':`color-mix(in oklab, ${c} 30%, var(--line))`}`
        }}>
          IT予算比率: <span className="mono" style={{fontWeight:500, fontSize:14}}>{ratio.toFixed(1)}%</span>（{level}）
          <div style={{fontSize:11, color:'var(--ink-3)', marginTop:4, fontFamily:'var(--font-mono)', letterSpacing:'.02em'}}>
            JP 3.2% (ITR) · Global 5.5% (Deloitte) · US 8.2% (Flexera)
          </div>
        </div>
      )}
    </div>
  );
}

/* ============================================================
   Main App
   ============================================================ */
function App(){
  const [view, setView] = useState('intro');
  const [theme, setTheme] = useState(() => localStorage.getItem('forg:theme') || 'paper');
  const [customer, setCustomer] = useState('');
  const [sc, setSc] = useState({
    s1:0,s2:0,s3:0,s4:0,s5:0,s6:0,
    l1:0,l2:0,l3:0,l4:0,l5:0,l6:0,
    c1:0,c2:0,c4:0,c5:0,
    lp1:0,lp2:0,lp3:0,lp4:0,lp5:0,lp6:0,
    itBudget:0, revenue:0
  });

  const [navOpen, setNavOpen] = useState(false);

  const up = (k,v) => setSc(p=>({...p,[k]:v}));
  const onSc = up;

  useEffect(()=>{
    document.body.setAttribute('data-theme', theme);
    localStorage.setItem('forg:theme', theme);
  },[theme]);

  /* カーソルオーラ — 520px の accent グロー円が z-index 0 で追従（Console UI v2.0） */
  const auraRef = useRef(null);
  useEffect(()=>{
    const el = auraRef.current;
    if (!el || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const move = (e)=>{
      if (e.pointerType && e.pointerType!=='mouse') return;
      el.style.left = e.clientX + 'px';
      el.style.top  = e.clientY + 'px';
      el.style.opacity = '1';
    };
    const leave = ()=>{ el.style.opacity = '0'; };
    window.addEventListener('pointermove', move, {passive:true});
    document.documentElement.addEventListener('pointerleave', leave);
    return ()=>{
      window.removeEventListener('pointermove', move);
      document.documentElement.removeEventListener('pointerleave', leave);
    };
  },[]);

  useEffect(()=>{
    window.scrollTo({top:0, behavior:'smooth'});
  },[view]);

  useEffect(()=>{
    const els = document.querySelectorAll('.reveal:not(.in)');
    const io = new IntersectionObserver((entries)=>{
      entries.forEach(e=>{ if (e.isIntersecting) e.target.classList.add('in'); });
    }, { threshold:0 });   /* Console UI v2.0: threshold 0 */
    els.forEach(el=>{
      /* 初期ビューポート内は即時表示（IO 発火が遅延・停止する環境でも白紙にしない）。
         画面外はスクロール出現に委ねる */
      const r = el.getBoundingClientRect();
      if (r.top < window.innerHeight && r.bottom > 0) el.classList.add('in');
      else io.observe(el);
    });
    return ()=>io.disconnect();
  },[view]);

  /* ========== calculations (verbatim from forg v4.3.0) ========== */
  const calc = useMemo(()=>{
    const sVals = [sc.s1,sc.s2,sc.s3,sc.s4,sc.s5,sc.s6].filter(v=>v>0);
    const S = sVals.length>0 ? sVals.reduce((a,b)=>a+b,0)/sVals.length : 0;

    const lVals = [sc.l1,sc.l2,sc.l3,sc.l4,sc.l5,sc.l6].filter(v=>v>0);
    const L = lVals.length>0 ? lVals.reduce((a,b)=>a+b,0)/lVals.length : 0;

    let budgetRatio = 0, budgetScore = 0;
    if (sc.revenue>0 && sc.itBudget>0){
      budgetRatio = (sc.itBudget/sc.revenue)*100;
      if      (budgetRatio<1) budgetScore=1;
      else if (budgetRatio<3) budgetScore=2;
      else if (budgetRatio<5) budgetScore=3;
      else if (budgetRatio<8) budgetScore=4;
      else                    budgetScore=5;
    }

    const cVals = [sc.c1,sc.c2,budgetScore,sc.c4,sc.c5].filter(v=>v>0);
    const C = cVals.length>0 ? cVals.reduce((a,b)=>a+b,0)/cVals.length : 0;

    const lpVals = [sc.lp1,sc.lp2,sc.lp3,sc.lp4,sc.lp5,sc.lp6].filter(v=>v>0);
    const lp_raw = lpVals.length>0 ? lpVals.reduce((a,b)=>a+b,0)/lpVals.length : 0;

    /* 矛盾ペナルティは累積適用（矛盾2件は1件より重くする）。判定基準は素点 lp_raw を使う */
    let lp_adj = lp_raw;
    const contradictions = [];
    if (S>=4 && lp_raw>=4){
      lp_adj = lp_adj*0.85;
      contradictions.push({title:"S×L' 乖離：「口先リーダーシップ」の疑い",
        desc:'変革意志（L\'）は高いが縦割り度（S）も高い。組織の壁が実際に存在する中で「やる気がある」と自己申告している場合、権限が伴っていない可能性があります。横断チームの結成と権限委譲が先決です。'});
    }
    if (C<=2 && lp_raw>=4){
      lp_adj = lp_adj*0.9;
      contradictions.push({title:"C×L' 逆相関：「孤軍奮闘」リスク",
        desc:'危機感（C）が低いのに変革意志（L\'）が高い。リーダーが先走り、組織が付いてきていない状態です。まずCを上げる——想定被害額の可視化と経営層への定量的な危機感醸成が優先です。'});
    }
    if (C>=4 && lp_raw<=2){
      contradictions.push({title:"C×L' 乖離：「外圧待ち・消去法型」",
        desc:'危機感（C）は高いのに変革意志（L\'）が低い。最も典型的な「外圧依存」パターンです。内部の変革チームを先に作り、オーナーシップを育てることが最重要です。'});
    }
    if (sc.s4>=4 && sc.lp4>=4){
      contradictions.push({title:"S4×L'4 乖離：「計画倒れ」リスク",
        desc:'経営計画にIT戦略は組み込まれているが、業務部門の取り組みをIT部門が把握していない。絵に描いた餅になるリスクがあります。業務部門との定期的なすり合わせ体制を構築してください。'});
    }
    if (budgetScore<=2 && budgetScore>0 && sc.c2>=4){
      contradictions.push({title:'C2×C3 乖離：「本音と建前」の疑い',
        desc:'セキュリティを「投資」と認識しているが、IT予算比率が低い。言葉と行動が一致していません。経営層の「投資」宣言を予算措置に転換する具体的なアクションが必要です。'});
    }
    if (sc.s6>=4 && sc.lp6>=4){
      contradictions.push({title:"S6×L'6 乖離：シャドーAIの上に変革を積んでいる",
        desc:'AI活用は組織的に推進しているのに、誰がどのAIサービスを使っているかを把握できていない。可視化しないまま利用だけが広がる状態は、統制外の経路に機密情報が流れ続けることを意味します。ZTDの用語で言えばUNKNOWNのまま残高だけが積み上がる状態であり、推進の前にAI通信の可視化とインベントリ化が先決です。'});
    }
    if (sc.c5>0 && sc.c5<=2 && sc.lp6>=4){
      contradictions.push({title:"C5×L'6 乖離：リスク未定義のままアクセルを踏んでいる",
        desc:'AI活用を推進しているが、経営層がリスクを具体的に把握していない。情報通信白書ではリスクを「わからない」と答えた企業が日本16.5%（米独中は1%台）。何が起きうるか言語化できていない状態での推進は、インシデント発生時に判断基準が存在しないことを意味します。利用ガイドラインではなく、企画・導入段階の審査基準の定義を優先してください。'});
    }
    if (sc.l1>=4 && budgetScore>=4){
      contradictions.push({title:'L1×C3 乖離：「金はあるのに動けない」症候群',
        desc:'IT予算比率は高水準だが、その大半が運用維持に消えている。予算の「量」ではなく「質」の問題です。固定費の圧縮によって攻めの原資を捻出する構造改革が必要です。'});
    }

    const LP = lp_adj;
    const denom = C*LP;
    const numer = S*L;
    let forg = denom>0 ? numer/denom : (S>0 ? 99 : 0);

    const c_high = C>=3;
    const lp_high = LP>=3;
    let archetype, arcIcon, arcColor, arcDesc, arcCell;
    if (c_high && lp_high){
      archetype='変革の臨界点（Zenith型）'; arcIcon='rocket'; arcColor='var(--trust)';
      arcDesc='危機感と変革意志が高水準で揃っている、最も変革が加速しやすい状態です。AWでのTO-BE策定にすぐ着手できます。Start Small, Scale Fast。';
      arcCell='tr';
    } else if (!c_high && lp_high){
      archetype='孤立無援・理想家型'; arcIcon='lightning'; arcColor='var(--warn)';
      arcDesc='推進リーダーの熱量は本物ですが、組織全体の危機感がまだ醸成されていません。想定被害額の可視化とCSFギャップ分析を先行させてください。';
      arcCell='tl';
    } else if (c_high && !lp_high){
      archetype='外圧依存・消去法型'; arcIcon='fire'; arcColor='var(--danger)';
      arcDesc='危機感は高いが、変革を自分事として引き受けるリーダーシップが不足。内部チャンピオンを特定し、変革ストーリーを内面化させてください。';
      arcCell='br';
    } else {
      archetype='安穏・思考停止型'; arcIcon='sleep'; arcColor='var(--ink-3)';
      arcDesc='危機感・変革意志ともに低く、正常性バイアスが働いている状態です。同業他社のインシデント事例で「自社に起きたら」をリアルに体感させてください。';
      arcCell='bl';
    }

    let damage = 0;
    if (sc.revenue>0){
      const daily = sc.revenue/365;

    if (sc.s4>=4) recs.push({p:1,t:'シャドーIT/DXの棚卸し（S4削減）',d:'業務部門が独自に導入しているSaaS・AIツールを全社棚卸しし、リスクと効果の両面で可視化してください。'});
    if (L>=4) recs.push({p:1,t:'「守りのIT」比率の可視化と圧縮（L削減）',d:'IT予算の大半が運用維持に消えている状態です。ゼロトラスト統合による固定資産削減シミュレーションを提示し、「攻めのIT」への原資創出を提案してください。'});
    if (sc.l1>=4) recs.push({p:1,t:'IT予算の攻守比率を経営層にベンチマーク提示',d:'DXレポートが指摘する「70-80%が守りに消える」構造そのものです。運用維持コストの削減ロードマップと、削減分の再投資計画を策定してください。'});
    if (sc.l2>=4) recs.push({p:1,t:'クラウドリフト＆シフト計画の策定',d:'オンプレ依存度が高い状態です。業務アプリのクラウド移行優先順位を決め、ZTNA経由のアクセスに切り替える計画を策定してください。'});
    if (C<=2 && cVals.length>0) recs.push({p:1,t:'想定被害額の定量化でCを引き上げる',d:'経営層が「自分事」になっていません。同業他社のインシデント事例と自社の想定被害額算出を実施し、「未来の外圧を前借り」させてください。'});
    if (budgetScore<=2 && budgetScore>0) recs.push({p:1,t:'IT投資比率の引き上げ提案',d:`IT予算の売上高比率が${budgetRatio.toFixed(1)}%で、日本中央値（3.2%）すら下回っています。グローバル平均は5.5%、US平均は8.2%。経営層にベンチマークデータを提示し、競争力維持に必要な投資水準を議論してください。`});
    if (LP<=2 && lpVals.length>0) recs.push({p:1,t:'内部チャンピオンの特定と巻き込み',d:'L\'が不足しています。「失敗した時に最も痛い目を見る人」を特定し、個別ストーリーを作ってください。'});
    if (sc.lp4<=2 && sc.lp4>0) recs.push({p:1,t:'中計へのIT戦略組み込み',d:'経営戦略とIT戦略が分離しています。次期中計策定時にIT/DX戦略を必須議題として組み込む提案をしてください。'});
    if (sc.lp5<=2 && sc.lp5>0) recs.push({p:2,t:'PoC文化の醸成（失敗許容度の向上）',d:'「一発勝負」文化が変革のアジリティを殺しています。小規模PoCの反復を前提とした予算枠（失敗予算）の設定を提案してください。'});
    if (sc.s6>=4) recs.push({p:1,t:'シャドーAIの可視化とインベントリ化（S6削減）',d:'業務で使われている生成AIサービスをまず洗い出し、通信の可視化と許可制への移行を進めてください。情報通信白書では日本企業の86.4%が業務で生成AIを利用する一方、統制側の整備は追いついていません。ガイドライン整備（41.1%）より、企画・導入段階の審査体制（26.1%）の方が国際的に大きく劣後している点が要点です。'});
    if (sc.l6>=4) recs.push({p:1,t:'AIが参照可能なデータ基盤の整備（L6削減）',d:'社内データがサイロに閉じたままではAIは業務を動かせません。日本24.5%に対しドイツ54.4%・米国57.2%・中国73.0%。データ整備は「AI活用のため」だけでなく、データ所在の棚卸しそのものがゼロトラストのデータ柱の前提になります。'});
    if (sc.c5>0 && sc.c5<=2) recs.push({p:1,t:'AIリスクの言語化と経営層への提示（C5引き上げ）',d:'リスクが「わからない」状態では投資判断ができません。情報漏洩・著作権・誤情報の3類型で自社の想定シナリオを具体化し、役員会の議題に載せてください。日本の16.5%という数字は、他3か国（1%台）と比べて突出しています。'});
    if (sc.lp6>0 && sc.lp6<=2) recs.push({p:1,t:'AI活用の組織的推進体制の立ち上げ（L\'6引き上げ）',d:'個人の効率化で止まっている状態です。情報通信白書は「汎用AIによる個人効率化 → 一部プロセスへの組み込み → プロセス全体の最適化」の3段階を示し、ステップ1で止まる企業が多いと警告しています。日本の「組織的な取組はない」27.0%（米国1.4%）、中小企業では45.6%。部門横断の推進体制と効果測定の枠組みを先に置いてください。'});
    if (S>=3 && S<4) recs.push({p:2,t:'インフォーマル連携の意図的な創出',d:'横断チャンネル設置など、小さな接点を増やすことで自然に縦割りを溶かしてください。'});
    if (sc.l4>=4) recs.push({p:2,t:'現場の「限界感」を経営層に伝達',d:'担当者が限界を感じていない場合、変革の内的動機が生まれません。運用工数の可視化と将来リスクのシミュレーションで危機感を醸成してください。'});
    if (c_high && lp_high) recs.push({p:2,t:'TO-BE設計のスコープを今すぐ画定する',d:'CISA ZTMM v2.0を参照しながら、自社の優先柱を3ヶ月以内に確定しPOCスコープを絞り込んでください。'});
    recs.push({p:3,t:'Start Small, Scale Fast の実行計画',d:'最も攻撃表面が大きい領域を1つ選び、完成形を小規模で先行導入してください。'});
    recs.sort((a,b)=>a.p-b.p);

    const answered = Object.entries(sc).filter(([k,v])=>v>0 && k!=='itBudget' && k!=='revenue').length + (sc.itBudget>0 && sc.revenue>0 ? 1 : 0);

    /* v4.3.0(19問)時代のベースライン。23問構成での基準値は未確定（ユーザー判断待ち）のため参考値扱い */
    const INDUSTRY_AVG = { default:{ S:3.0, L:3.5, C:2.8, LP:2.8 }};
    const avg = INDUSTRY_AVG.default;
    const deviations = {
      S:  S  - avg.S,
      L:  L  - avg.L,
      C:  avg.C  - C,
      LP: avg.LP - LP
    };
    const priorityOrder = ['LP','S','C','L'];
    let dominantVar = priorityOrder[0];
    for (const k of priorityOrder.slice(1)){
      if (deviations[k] > deviations[dominantVar]) dominantVar = k;
    }
    const PATTERN_META = {
      S:  { id:'silo_strong',     name:'縦割りが強い',
            diagnosis:'縦割りの壁が厚く、横断の意思決定が通らない',
            action:'次の経営会議で、横断変革チームの経営スポンサーを1人指名する',
            kotter:'Kotter Step 2 (Coalition)' },
      L:  { id:'legacy_heavy',    name:'技術的負債が重い',
            diagnosis:'IT予算の大半が「守りのIT」に消えている',
            action:'「いつまでにどの業務環境を現代化するか」の期限をボードで合意する',
            kotter:'Kotter Step 4 (Communicate)' },
      C:  { id:'crisis_weak',     name:'危機感が弱い',
            diagnosis:'経営層が同業他社のインシデントを「他人事」と捉えている',
            action:'同業被害事例と自社の想定被害額を、次の役員会で定量提示する',
            kotter:'Kotter Step 1 (Urgency)' },
      LP: { id:'leadership_weak', name:'変革意志が弱い',
            diagnosis:'変革失敗時に痛い目を見る責任者が特定されていない',
            action:'次のQで、セキュリティ投資の意思決定権を持つ事業責任者を1人指名する',
            kotter:'Kotter Step 3 (Vision)' }
    };
    /* 弱点判定は4状態。deviations は S/L の逆極性を吸収済みで「正＝業界平均より不利」に正規化されている。
       (1) 未測定軸あり  → insufficient_axis_coverage : 未回答軸は 0 点として偏差に載るため判定自体を保留する
       (2) maxDev <= -EPS → no_dominant_weakness      : どの軸も業界平均より不利ではない
       (3) |maxDev| < EPS → industry_average_zone     : 平均圏。argmax は弱点断定ではなく参考情報に留める
       (4) maxDev >=  EPS → PATTERN_META の4弱点パターン（従来動作） */
    /* EPS は (avgS−EPS)(avgL−EPS) < (avgC+EPS)(avgLP+EPS) を満たす必要がある（現行基準では EPS>0.2198）。これを割ると no_dominant_weakness が F≥1（停滞帯）と同時に成立し、良好判定が F と矛盾する。INDUSTRY_AVG を23問基準へ改訂する際は必ず再導出すること */
    const EPS = 0.25;
    const NO_WEAKNESS_META = {
      id:'no_dominant_weakness', name:'顕著な弱点なし',
      diagnosis:'変革を妨げる支配的な弱点は検出されない。ボトルネックは組織要因の外にある可能性が高い',
      action:'業界平均比で不利な軸がない今のうちに、先行導入の対象領域を1つ画定し今Qで着手する',
      kotter:'Kotter Step 6 (Short-term Wins)'
    };
    const AVERAGE_ZONE_META = {
      id:'industry_average_zone', name:'平均圏・突出した弱点なし',
      diagnosis:'最も不利な軸でも業界平均との差は 0.25 未満で、単独の支配的弱点は検出されない',
      action:'相対的に最も不利な軸を仮の重点軸として、次Qの改善テーマを1つ設定する',
      kotter:null
    };
    const INSUFFICIENT_META = {
      id:'insufficient_axis_coverage', name:'判定に必要な軸が未測定',
      diagnosis:'S/L/C/L\' のうち未回答の軸があり、支配的な弱点は判定できない',
      action:'未回答の章を回答したうえで再判定する',
      kotter:null
    };
    const measured = { S:sVals.length>0, L:lVals.length>0, C:cVals.length>0, LP:lpVals.length>0 };
    const allMeasured = measured.S && measured.L && measured.C && measured.LP;
    const maxDev = allMeasured ? deviations[dominantVar] : null;
    const isWeaknessPattern = allMeasured && maxDev >= EPS;
    const showAxis = allMeasured && maxDev > -EPS;   /* average_zone / 4弱点パターンのみ軸を提示 */
    const pm = !allMeasured   ? INSUFFICIENT_META
             : maxDev <= -EPS ? NO_WEAKNESS_META
             : maxDev <   EPS ? AVERAGE_ZONE_META
             : PATTERN_META[dominantVar];
    const axisDeviations = {
      S:  measured.S  ? deviations.S  : null,
      L:  measured.L  ? deviations.L  : null,
      C:  measured.C  ? deviations.C  : null,
      LP: measured.LP ? deviations.LP : null
    };
    const dominantPattern = {
      pattern_id: pm.id,
      pattern_name_ja: pm.name,
      diagnosis_ja: pm.diagnosis,
      most_deviated_variable: showAxis ? dominantVar : null,
      deviation: isWeaknessPattern ? maxDev : null,
      max_axis_deviation: maxDev,
      deviations: axisDeviations
    };
    const suggestion = {
      action_ja: pm.action,
      reference_framework: pm.kotter,
      common_footer_ja: 'セキュリティ対策は手段です。守るべき事業価値が先に定義されている必要があります'
    };
    const forgIndustryAvg = (avg.S*avg.L)/(avg.C*avg.LP);

    return {
      S,L,C,LP,forg,archetype,arcIcon,arcColor,arcDesc,arcCell,
      contradictions, damage, recs, answered, budgetRatio, budgetScore,
      dominantPattern, suggestion, forgIndustryAvg
    };
  },[sc]);

  const forgStr = calc.forg>10 ? '10.0+' : calc.forg.toFixed(2);
  const forgColor = calc.forg<1 ? 'var(--trust)' : calc.forg<2 ? 'var(--warn)' : 'var(--danger)';
  const forgStatus = calc.forg===0 ? '入力待ち…' : calc.forg<1 ? '変革の加速帯' : calc.forg<2 ? '変革の停滞帯' : '変革の膠着帯';

  const currentSection = SECTIONS.find(s=>s.key===view);
  const nextMap = {intro:'S', S:'L', L:'C', C:'LP', LP:'result'};

  const sectionsAnswered = useMemo(() => {
    const m = { intro: calc.answered>0 };
    SECTIONS.forEach(sec => {
      const done = sec.questions.every(q => q.type==='budget'
        ? (sc.itBudget>0 && sc.revenue>0)
        : (sc[q.id]||0) > 0);
      m[sec.key] = done;
    });
    m.result = calc.answered >= 10;
    return m;
  }, [sc, calc.answered]);

  /* ====== サイドナビ移設に伴い App へ引き上げ（本体は Result 版と同一・ロジック不変） ====== */
  const doReset = () => {
    if (calc.answered>0 && !window.confirm('回答をすべてリセットします。よろしいですか？')) return;
    setSc({
      s1:0,s2:0,s3:0,s4:0,s5:0,s6:0,
      l1:0,l2:0,l3:0,l4:0,l5:0,l6:0,
      c1:0,c2:0,c4:0,c5:0,
      lp1:0,lp2:0,lp3:0,lp4:0,lp5:0,lp6:0,
      itBudget:0, revenue:0
    });
    setView('S');
  };

  const doExport = () => {
    try {
      /* ③ canonical meta helpers (ztelier共通) */
      const makeSessionId = (name) => {
        const slug = String(name || 'unnamed')
          .trim().toLowerCase()
          .replace(/[^a-z0-9\u3040-\u309f\u30a0-\u30ff\u4e00-\u9fff]+/g, '-')
          .replace(/^-+|-+$/g, '') || 'unnamed';
        const dt = new Date().toISOString().slice(0,10).replace(/-/g,'');
        return `${slug}-${dt}`;
      };
      const sessionId = makeSessionId(customer);
      const generatedAt = new Date().toISOString();

      /* 偏差値は浮動小数ノイズ（-0.20000000000000018 等）を避けて小数4桁で出す。null は素通し */
      const r4 = v => v===null ? null : Math.round(v*1e4)/1e4;
      const dp = calc.dominantPattern;
      const dominantPatternOut = { ...dp,
        deviation: r4(dp.deviation),
        max_axis_deviation: r4(dp.max_axis_deviation),
        deviations: { S:r4(dp.deviations.S), L:r4(dp.deviations.L), C:r4(dp.deviations.C), LP:r4(dp.deviations.LP) }
      };

      const payload = {
        /* === ③ canonical root meta (ztelier 共通) === */
        format: 'forg-v4',
        tool_version: APP_VER.replace(/^v/,''),
        generated_at: generatedAt,
        customer: {
          company_name: customer || 'unnamed',
          session_id: sessionId
        },
        /* === 後方互換: 既存の取込側 importForg の schema_version パス保持 === */
        meta:{
          schema_version:'1.1.0',
          ztelier_version:'1.1.0',
          session_id: sessionId,
          created_at: generatedAt,
          created_by:'Forg Ztelier v4.0.0'
        },
        forg:{
          completed: calc.answered===23,
          version:'4.4.0',
          question_set:'v2-ai',
          variables:{ S:calc.S, L:calc.L, C:calc.C, LP:calc.LP },
          budget_ratio: calc.budgetScore>0 ? {
            it_budget_jpy: sc.itBudget*100000000,
            annual_revenue_jpy: sc.revenue*100000000,
            ratio_percent: calc.budgetRatio,
            score: calc.budgetScore
          } : null,
          F_value: calc.forg,
          F_status: calc.forg===0 ? null : (calc.forg<1?'変革の加速帯':calc.forg<2?'変革の停滞帯':'変革の膠着帯'),
          industry_average_F: calc.forgIndustryAvg,
          deviation_from_average: calc.forg - calc.forgIndustryAvg,
          archetype: { cell_id:calc.arcCell, name_ja:calc.archetype, description_ja:calc.arcDesc },
          contradictions: calc.contradictions.map(c=>({ pattern_id:null, title_ja:c.title, description_ja:c.desc })),
          damage_estimate_jpy: calc.damage*100000000,
          damage_estimate_basis: {
            method:'revenue_based',
            formula:'annual_revenue / 365 * 14days * 20% + 200M JPY',
            note_ja:'売上ベースの概算値です。摩擦係数 F とは独立に算出されます。'
          },
          recommendations: calc.recs.map(r=>({ priority:r.p, title_ja:r.t, description_ja:r.d, trigger_variable:null })),
          dominant_pattern: dominantPatternOut,
          suggestion: calc.suggestion
        }
      };
      const blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `ztelier-context-${customer||'unnamed'}-${new Date().toISOString().slice(0,10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
    } catch(e){
      alert('OVERDUE 連携エラー: ' + e.message);
      console.error(e);
    }
  };

  return (
    <div className="app">
      <div className="aura" ref={auraRef} aria-hidden="true"/>

      <SideNav view={view} setView={setView} theme={theme} setTheme={setTheme}
               sc={sc} forgStr={forgStr} forgColor={forgColor} forgStatus={forgStatus}
               answered={calc.answered} sectionsAnswered={sectionsAnswered}
               navOpen={navOpen} setNavOpen={setNavOpen}
               onExport={doExport} onReset={doReset} onPrint={()=>window.print()}/>

      <main className="main">
        <div className="view-frame" key={view}>
          {view==='intro' && <IntroView setView={setView} calc={calc} sc={sc} customer={customer} setCustomer={setCustomer} forgStr={forgStr} forgColor={forgColor} forgStatus={forgStatus}/>}

          {currentSection && <ChapterView section={currentSection} sc={sc} up={up} onSc={onSc} setView={setView} nextKey={nextMap[view]}/>}

          {view==='result' && <ResultView calc={calc} sc={sc} customer={customer} forgStr={forgStr} forgColor={forgColor} forgStatus={forgStatus} setView={setView} doReset={doReset} doExport={doExport}/>}
        </div>

        <footer className="footer">
          <div>F<sub>org</sub> Journey · 組織摩擦診断 v4.4 — Organizational Friction Atelier</div>
          <div style={{marginTop:8, fontSize:11.5, color:'var(--ink-4)'}}>
            23 questions (S:6 / L:6 / C:5 / L':6) · ITR 2026 · Deloitte · Flexera · 総務省 情報通信白書 2026　※v4.4.0でAI統制4問を追加。F値はv4.3.0（19問）と直接比較できません
          </div>
          <div style={{marginTop:6, fontSize:11, color:'var(--ink-4)', letterSpacing:'.08em'}}>App {APP_VER}</div>
          <div className="foot-badge no-print">
            <span style={{color:'var(--trust)', display:'inline-flex'}}><Icon name="shield" size={14}/></span>
            <span>完全ローカル動作 — 入力データは外部に一切送信されません。</span>
          </div>
          <div style={{marginTop:14, fontSize:11.5, color:'var(--ink-4)'}}>
            Designed by <a href="https://www.linkedin.com/in/takayoshi-takaoka/" target="_blank" rel="noopener">Takayoshi Takaoka</a>
          </div>
        </footer>
      </main>
    </div>
  );
}

        stats={[
